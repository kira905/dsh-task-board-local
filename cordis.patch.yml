# dsh-task-board-local bundle patch: inserts the dual-face plugin row into the
# web profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field) over dsh-base.
#
# Local fork of @linxin666/dsh-client-ui-task-board 0.3.4 (detached from
# upstream): human acceptance gate (`review`), card kinds
# (once/recurring/interactive), and editable notes on executed cards.
#
# The row is a bare plugin by package name: the node half (exports ".") runs
# in the host process (the system-prompt announcement section), and the
# `dsh.client` declaration in package.json makes the browser half
# (exports "./client", served at /plugins/<id>/client.js) load in the web GUI.
- insert:
    - id: ui-task-board-local
      name: '@kira905/dsh-task-board-local'
